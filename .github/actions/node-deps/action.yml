name: Node dependencies
description: >-
  Node 20 plus node_modules restored from cache, keyed on package-lock.json. `npm ci` runs only
  on a cache miss, i.e. when the lockfile changed. Before 2026-10-02 every Node job paid 70-90s
  of `npm ci` on every run, twice per run (frontend + audit).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    # The key carries the OS, the Node major and the exact lockfile. node_modules holds native
    # binaries built for one platform and one Node ABI, so any of the three changing must miss.
    - uses: actions/cache@v4
      id: node-modules
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
