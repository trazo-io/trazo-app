[build]
  publish = "dist"
  command = "npm ci --legacy-peer-deps && npm run build"
  
# Force cache invalidation - 2025-01-12

# Enable proper CSS processing for CSS-in-JS libraries like Chakra UI
[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.environment]
  VITE_APP_BASE_URL = "https://app.trazo.io"
  VITE_CONSUMER_BASE_URL = "https://consumer.trazo.io"
  VITE_APP_BASE_DOMAIN = "trazo.io"
  VITE_APP_BACKEND_URL = "https://api.trazo.io/api"
  VITE_APP_CSRF_COOKIE_NAME = "csrftoken"
  VITE_APP_ENV = "production"
  PUBLIC_URL = "https://app.trazo.io"
  # Ensure proper CSS-in-JS processing
  NODE_ENV = "production"
  # Ensure all dependencies are installed including devDependencies
  NPM_FLAGS = "--legacy-peer-deps"
  # Force cache bust for S3 batch loading fixes
  VITE_CSS_CACHE_BUST = "20250718-v11-s3-batch-fix"
  VITE_JS_CACHE_BUST = "20250718-v11-s3-batch-fix"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://maps.googleapis.com https://connect.facebook.net https://appleid.cdn-apple.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.trazo.io https://trazo-media.s3.us-east-2.amazonaws.com https://maps.googleapis.com https://accounts.google.com https://graph.facebook.com https://api.deepgram.com wss://api.deepgram.com wss://api.trazo.io https://*.ingest.us.sentry.io; frame-src 'self' https://accounts.google.com https://www.facebook.com https://appleid.apple.com https://js.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache, no-store, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm ci --legacy-peer-deps && npm run build"

[context.branch-deploy]
  command = "npm ci --legacy-peer-deps && npm run build"