[build]
  publish = "dist"
  command = "env && npm run build"
  
# Force cache invalidation - 2025-01-08

# Disable asset optimization that can break CSS-in-JS libraries like Chakra UI
[build.processing]
skip_processing = false

[build.processing.css]
bundle = false
minify = false

[build.environment]
  VITE_APP_BASE_URL = "https://app-staging.trazo.io"
  VITE_APP_BASE_DOMAIN = "trazo.io"
  VITE_APP_BACKEND_URL = "https://api-staging.trazo.io/api/"
  VITE_APP_CSRF_COOKIE_NAME = "csrftoken"
  VITE_APP_ENV = "production"
  PUBLIC_URL = "https://app-staging.trazo.io"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "env && npm run build"

[context.branch-deploy]
  command = "env && npm run build"