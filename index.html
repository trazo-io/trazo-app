<!DOCTYPE html>
<html lang="en" dir="ltr" layout="admin">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="emotion-insertion-point" content="" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="theme-color" content="#2E7D32" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon.png" />
    <!-- Legacy template CDN includes (chartist, jvectormap, dataTables,
         fontawesome v5) removed 2026-06: all four were CSP-blocked in
         production (console errors on every page load) and nothing in src/
         references them — the app uses react-icons and recharts. -->
    <!--     Fonts and icons     -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY_HERE"></script> -->
    <!-- Pre-pivot positioning until 2026-08-11; the product is organic recordkeeping. This is the
         browser-tab title on every page and the default share/preview title. -->
    <title>Trazo — Organic farm recordkeeping</title>
    <style>
      /* Essential layout fixes for sidebar positioning */
      :root {
        --sidebar-width: 275px;
      }

      /* Only critical layout fixes without overriding Chakra UI styles */
      @media screen and (min-width: 1280px) {
        .chakra-ui-light [data-theme] .css-1lekzkb,
        .chakra-ui-dark [data-theme] .css-1lekzkb {
          margin-left: var(--sidebar-width) !important;
          width: calc(100% - var(--sidebar-width)) !important;
        }
      }

      /* Ensure fonts load properly */
      body {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          Arial, sans-serif;
      }

      /* Prevent layout shift during hydration */
      #root {
        min-height: 100vh;
      }

      /* Prevent horizontal scroll on mobile */
      html,
      body {
        overflow-x: hidden;
        max-width: 100%;
        -webkit-text-size-adjust: 100%;
      }

      /* Prevent iOS Safari auto-zoom on input focus (requires >= 16px) */
      @media screen and (max-width: 1024px) {
        input,
        select,
        textarea,
        input[type='text'],
        input[type='password'],
        input[type='email'],
        input[type='number'],
        input[type='tel'],
        input[type='search'] {
          font-size: 16px !important;
        }
      }

      /* iPhone safe area insets for notch/Dynamic Island */
      @supports (padding: env(safe-area-inset-left)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      /* Ensure proper text rendering */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <script>
      // Chakra UI ColorModeScript equivalent for proper color mode initialization
      (function () {
        try {
          var colorMode = localStorage.getItem('chakra-ui-color-mode');
          if (colorMode) {
            document.documentElement.setAttribute('data-theme', colorMode);
            document.documentElement.classList.add('chakra-ui-' + colorMode);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('chakra-ui-light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('chakra-ui-light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
