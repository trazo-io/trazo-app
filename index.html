<!DOCTYPE html>
<html lang="en" dir="ltr" layout="admin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="emotion-insertion-point" content="">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon.png" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.css" />
    <script src="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jvectormap/2.0.4/jquery-jvectormap.css"
      type="text/css"
      media="screen"
    />
    <link
      rel="stylesheet"
      href="//cdn.datatables.net/1.10.16/css/jquery.dataTables.min.css"
      type="text/css"
      media="screen"
    />
    <!--     Fonts and icons     -->
    <link href="https://use.fontawesome.com/releases/v5.0.7/css/all.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY_HERE"></script> -->
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
    <title>Trazo - Agricultural Transparency Platform</title>
    <style>
      /* Essential layout fixes for sidebar positioning */
      :root {
        --sidebar-width: 275px;
      }

      /* Only critical layout fixes without overriding Chakra UI styles */
      @media screen and (min-width: 1280px) {
        .chakra-ui-light [data-theme] .css-1lekzkb,
        .chakra-ui-dark [data-theme] .css-1lekzkb {
          margin-left: var(--sidebar-width) !important;
          width: calc(100% - var(--sidebar-width)) !important;
        }
      }

      /* Ensure fonts load properly */
      body {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
          Arial, sans-serif;
      }

      /* Prevent layout shift during hydration */
      #root {
        min-height: 100vh;
      }

      /* Ensure proper text rendering */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <script>
      // Chakra UI ColorModeScript equivalent for proper color mode initialization
      (function () {
        try {
          var colorMode = localStorage.getItem('chakra-ui-color-mode');
          if (colorMode) {
            document.documentElement.setAttribute('data-theme', colorMode);
            document.documentElement.classList.add('chakra-ui-' + colorMode);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('chakra-ui-light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('chakra-ui-light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
