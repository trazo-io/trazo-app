<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo - Agricultural Carbon Transparency</title>
    <style>
      /* Fix sidebar layout issues in production */
      :root {
        --sidebar-width: 275px;
      }

      /* Ensure proper MainPanel layout */
      @media screen and (min-width: 1280px) {
        .css-1lekzkb, /* MainPanel base class */
        [data-theme] .css-1lekzkb {
          margin-left: var(--sidebar-width) !important;
          width: calc(100% - var(--sidebar-width)) !important;
        }
      }

      /* Fix card backgrounds in production */
      .chakra-ui-light .css-bg4444,
      .chakra-ui-light [data-theme='light'] .css-bg4444 {
        background-color: #ffffff !important;
      }

      .chakra-ui-dark .css-bg4444,
      .chakra-ui-dark [data-theme='dark'] .css-bg4444 {
        background-color: #2d3748 !important;
      }

      /* Prevent content overflow */
      .css-1lekzkb {
        overflow-x: hidden !important;
        max-width: 100% !important;
      }

      /* Ensure proper grid layout */
      .css-gmuwbf {
        max-width: 100% !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
